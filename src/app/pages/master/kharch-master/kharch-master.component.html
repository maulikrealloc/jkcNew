<mat-card class="cardWithShadow">
    <mat-card-content class="p-24">
        <div class="row justify-content-between">

            <div class="col-lg-4">
                <mat-form-field appearance="outline" class="w-100 hide-hint">
                    <input matInput placeholder="Search Kharch.." (keyup)="applyFilter($any($event.target).value)">
                    <mat-icon matSuffix>
                        <i-tabler name="search" class="icon-20"></i-tabler>
                    </mat-icon>
                </mat-form-field>
            </div>

            <div class="col-lg-4 d-flex align-items-center justify-content-end">
                <button mat-flat-button color="primary" (click)="addkharch('Add', {})">
                    Add Kharch
                </button>
            </div>
        </div>
    </mat-card-content>
</mat-card>

<mat-card class="cardWithShadow">
    <div class="row" style="margin: 15px">
        <div class="col-6">
            <mat-card class="cardWithShadow">
                <mat-card-content class="p-24">
                    <div class="col-12">
                        <mat-label class="mat-subtitle-2 f-w-700 m-b-8 d-block"> Unit List :- </mat-label>
                    </div>
                    <div class="table-responsive">
                        <table mat-table [dataSource]="unitDataSource" class="w-100">

                            <ng-container matColumnDef="srNo">
                                <th mat-header-cell *matHeaderCellDef class="f-s-16 f-w-600">Sr No</th>
                                <td mat-cell *matCellDef="let element; let i = index">{{ i + 1 }}</td>
                            </ng-container>

                            <ng-container matColumnDef="name">
                                <th mat-header-cell *matHeaderCellDef class="f-s-16 f-w-600">
                                    Unit Name
                                </th>
                                <td mat-cell *matCellDef="let element" class="f-s-14">
                                    {{ element.name }}
                                </td>
                            </ng-container>

                            <ng-container matColumnDef="action">
                                <th mat-header-cell *matHeaderCellDef class="f-s-16 f-w-600">
                                    Action
                                </th>
                                <td mat-cell *matCellDef="let element; let i = index" class="action-link">
                                    <a class="m-r-10 cursor-pointer" (click)="addkharch('Edit', element)">
                                        <i-tabler name="edit" class="icon-18"></i-tabler>
                                    </a>
                                    <a class="m-r-10 cursor-pointer" (click)="addkharch('Delete', element)">
                                        <i-tabler name="trash" class="icon-18"></i-tabler>
                                    </a>
                                </td>
                            </ng-container>

                            <tr mat-header-row *matHeaderRowDef="kharchMasterDataColumns"></tr>
                            <tr mat-row *matRowDef="let row; columns: kharchMasterDataColumns"></tr>
                            <tr class="mat-row" style="text-align: center;" *matNoDataRow>
                                <td class="mat-cell" [attr.colspan]="kharchMasterDataColumns.length">
                                    No record found
                                </td>
                            </tr>
                        </table>
                    </div>
                </mat-card-content>
            </mat-card>
        </div>

        <div class="col-6">
            <mat-card class="cardWithShadow">
                <mat-card-content class="p-24">
                    <div class="col-12">
                        <mat-label class="mat-subtitle-2 f-w-700 m-b-8 d-block"> Kharch List :- </mat-label>
                    </div>
                    <div class="table-responsive">
                        <table mat-table [dataSource]="kharchDataSource" class="w-100">

                            <ng-container matColumnDef="srNo">
                                <th mat-header-cell *matHeaderCellDef class="f-s-16 f-w-600">Sr No</th>
                                <td mat-cell *matCellDef="let element; let i = index">{{ i + 1}}</td>
                            </ng-container>

                            <ng-container matColumnDef="name">
                                <th mat-header-cell *matHeaderCellDef class="f-s-16 f-w-600">
                                    Unit Name
                                </th>
                                <td mat-cell *matCellDef="let element" class="f-s-14">
                                    {{ element.name }}
                                </td>
                            </ng-container>

                            <ng-container matColumnDef="action">
                                <th mat-header-cell *matHeaderCellDef class="f-s-16 f-w-600">
                                    Action
                                </th>
                                <td mat-cell *matCellDef="let element;let i = index" class="action-link">
                                    <a class="m-r-10 cursor-pointer">
                                        <i-tabler name="edit" class="icon-18"></i-tabler>
                                    </a>
                                    <a class="m-r-10 cursor-pointer">
                                        <i-tabler name="trash" class="icon-18"></i-tabler>
                                    </a>
                                </td>
                            </ng-container>

                            <tr mat-header-row *matHeaderRowDef="kharchMasterDataColumns"></tr>
                            <tr mat-row *matRowDef="let row; columns: kharchMasterDataColumns"></tr>
                            <tr class="mat-row" style="text-align: center;" *matNoDataRow>
                                <td class="mat-cell" [attr.colspan]="kharchMasterDataColumns.length">
                                    No record found
                                </td>
                            </tr>
                        </table>
                    </div>
                </mat-card-content>
            </mat-card>
        </div>
    </div>
</mat-card>
