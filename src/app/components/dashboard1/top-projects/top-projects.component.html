<mat-card class="cardWithShadow">
  <mat-card-header class="d-flex">
    <div class="m-r-auto">
      <mat-card-title>Upcoming Payment Recevied date</mat-card-title>
    </div>
  </mat-card-header>
  <mat-card-content>
    <div class="table-responsive m-t-30">
      <table mat-table [dataSource]="PaymentdataSource" class="w-100">

        <!-- Name Column -->
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef class="f-w-600 mat-subtitle-1 f-s-14">Name</th>
          <td mat-cell *matCellDef="let element" class="mat-body-1">
            {{getPartyName(element?.partyId) }}
          </td>
        </ng-container>

        <!-- Date Column -->
        <ng-container matColumnDef="date">
          <th mat-header-cell *matHeaderCellDef class="f-w-600 mat-subtitle-1 f-s-14">Date</th>
          <td mat-cell *matCellDef="let element">
            {{convertTimestampToDate(element.paymentDueDate)| date : "dd-MM-yyyy" }}
          </td>
        </ng-container>

        <!-- Amount Column -->
        <ng-container matColumnDef="amount">
          <th mat-header-cell *matHeaderCellDef class="f-w-600 mat-subtitle-1 f-s-14">Amount</th>
          <td mat-cell *matCellDef="let element" class="mat-body-1">
            {{ element.finalAmount |number: '1.0-0' }}
          </td>
        </ng-container>

        <!-- Recived Column -->
         <!-- <ng-container matColumnDef="recived">
          <th mat-header-cell *matHeaderCellDef class="f-w-600 mat-subtitle-1 f-s-14">Recived</th>
          <td mat-cell *matCellDef="let element" class="mat-body-1">
            {{ element.partyMobile }}
          </td>
        </ng-container> -->

        <tr mat-header-row *matHeaderRowDef="PaymentColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: PaymentColumns"></tr>
      </table>
      <mat-paginator [pageSizeOptions]="[5, 10]" showFirstLastButtons></mat-paginator>
    </div>
  </mat-card-content>
</mat-card>
