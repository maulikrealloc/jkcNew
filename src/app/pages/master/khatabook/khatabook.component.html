<mat-tab-group mat-stretch-tabs="false" mat-align-tabs="start"   (selectedTabChange)="onTabChanged($event)">
    <mat-tab label="Order">
        <app-order-list  *ngIf="activeTab === 0"></app-order-list>
    </mat-tab>

    <mat-tab label="Report">
        <app-report  *ngIf="activeTab === 1"></app-report>
    </mat-tab>

</mat-tab-group>
