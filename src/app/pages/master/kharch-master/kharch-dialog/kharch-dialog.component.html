<h2 mat-dialog-title class="m-b-24 b-b-1 p-b-20">{{action}} Kharch</h2>
<mat-dialog-content class="mat-typography" *ngIf="action !== 'Delete'; else elseTemplate" style="max-width: 600px">
    <form [formGroup]="kharchForm">
        <div class="row">

            <div class="col-6">
                <mat-form-field appearance="outline" class="w-100 m-t-10">
                    <mat-label>Name</mat-label>
                    <input type="text" matInput required formControlName="name" placeholder="Enter name">
                </mat-form-field>
                <app-validation-message class="position-relative"
                    [control]="kharchForm.controls['name']"></app-validation-message>
            </div>

            <div class="col-6 selectUnit">
                <mat-label class="mat-subtitle-2 m-b-8 d-block">Unit & Kharch </mat-label>
                <mat-radio-group formControlName="unitKharch" aria-label="Select an option">
                    <mat-radio-button value="unit">Unit</mat-radio-button>
                    <mat-radio-button value="kharch">Kharch</mat-radio-button>
                </mat-radio-group>
                <app-validation-message class="position-relative"
                    [control]="kharchForm.controls['unitKharch']"></app-validation-message>
            </div>
        </div>
    </form>
</mat-dialog-content>
<mat-divider></mat-divider>
<mat-dialog-actions class="p-24 justify-content-end">
    <button mat-stroked-button color="warn" mat-dialog-close>Cancel</button>
    <button mat-flat-button [mat-dialog-close]="true" [disabled]="action !== 'Delete' && kharchForm.invalid"
        color="primary" (click)="doAction();">
        {{action}}
    </button>
</mat-dialog-actions>
<ng-template #elseTemplate>
    <div class="p-x-24">
        <p>Sure to delete <span class="f-w-600">{{local_data.Name}}</span> ?</p>
    </div>
    <mat-divider></mat-divider>
</ng-template>
